name: Quest + Floating Tools overhaul QA (non-publishing)

on:
  push:
    branches:
      - feature/mobile-v0.21.0-quest-tools-overhaul
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/mobile-companion-quest-floating-overhaul-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root Back policy, shared routes, privacy and app regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          qback=(base/'QuestBackApplication.java').read_text()
          comp=(base/'CompanionActivity.java').read_text()
          quest=(base/'QuestToolsActivity.java').read_text()
          mini=(base/'OverlayMiniVrcx.java').read_text()
          floating=(base/'FloatingCompanionService.java').read_text()
          api=(base/'VRChatApi.java').read_text()
          style=(base/'CompanionStyle.java').read_text()
          personal=(base/'UserThemePresets.java').read_text()
          update=(base/'MobileUpdaterActivity.java').read_text()
          version=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'interface QuestBackHost' in (base/'QuestBackHost.java').read_text()
          assert 'implements QuestBackHost' in comp
          assert 'implements QuestBackHost' in quest
          assert 'return showingUnlocked && !"home".equals(tab)' in comp
          assert 'return !isHub();' in quest
          assert 'QuestBackApplication.refresh(this);' in comp
          assert 'QuestBackApplication.refresh(this);' in quest
          assert 'existing.setVisibility(View.GONE)' in qback
          assert 'int top=show?dp(activity,60):0;' in qback
          assert 'back.setOnClickListener' in qback
          assert 'activity.onBackPressed();' in qback
          assert 'CompanionStyle.safeArea(this,root)' in quest
          assert 'if(!QuestDevice.isQuestDevice() && !isHub())' in quest
          assert 'new OverlayMiniVrcx(this,new OverlayMiniVrcx.Host(){' in quest
          assert '},false);' in quest
          assert 'private final boolean inlineBack;' in mini
          assert 'if(inlineBack){' in mini
          assert 'new OverlayMiniVrcx(this,new OverlayMiniVrcx.Host(){' in floating
          assert 'case "mini_friend_favorites":' in mini
          assert 'case "mini_friend_favorite_members":' in mini
          assert 'case "mini_mutual_friends":' in mini
          assert 'case "mini_mutual_groups":' in mini
          assert 'VRChatApi.favoriteFriendGroups(ctx)' in mini
          assert 'VRChatApi.favoriteFriendGroupContents(ctx,selectedFriendGroupName)' in mini
          assert 'VRChatApi.mutuals(ctx,groupSubjectUserId,false)' in mini
          assert 'VRChatApi.mutuals(ctx,groupSubjectUserId,true)' in mini
          assert '"Favorite friend groups","mini_friend_favorites"' in quest
          assert '"Browse favorite friend groups"' in quest and floating
          assert '"Mutual friends"' in mini and '"Mutual groups"' in mini
          assert '/users/"+userId+"/mutuals/"+kind' in api
          assert '"/favorites/groups/friend"' in api
          assert '"/favorites/groups/friend/"+name' in api
          assert 'cookie(validSession(context))' in api
          assert 'token=cookie(validSession(context))' in api
          assert 'rate limit' in api
          assert 'VRChat API' not in comp or 'StaffDex' in comp
          assert 'UserThemePresets' in personal
          assert 'verifySameSigner(candidate)' in update
          assert 'versionCode 74' in version and "versionName '0.21.0'" in version
          assert "applicationId 'club.thegamerclub.nodelab'" in version
          print('PASS: Root/back policy, one Quest nested back, floating back retained, shared favorite/mutual views and sensitive boundaries intact.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile non-publishing Android debug APK
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
