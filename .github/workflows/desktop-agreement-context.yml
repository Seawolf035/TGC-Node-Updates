name: Desktop agreement integration context audit (read only)
on:
  push:
    branches: [feature/desktop-mandatory-agreement-v1]
    paths: [.github/workflows/desktop-agreement-context.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant code paths from already published packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          inputs=[
            ("NODE","updates/standalone/TGC_Invite_Node_v1.1.10_Required_Update.zip",
             "tgc_invite_node.py",[(1,43),(320,355),(430,473),(1120,1148),(1170,1186)]),
            ("PLUGIN","updates/plugin/TGC_Invite_Node_Plugin_v1.1.10-plugin_Required_Update.zip",
             "tgc_invite_node_plugin.py",[(1,50),(320,410),(490,525),(1480,1535)]),
            ("STAFF","updates/staff-launcher/TGC_Staff_Launcher_v1.1.5_Required_Logging_Warning.zip",
             "TGC_Staff_Launcher_Package/TGC_Staff_Launcher.py",[(1,60),(85,154),(260,310),(730,770),(1270,1314)]),
            ("STAFF_NODE","updates/staff-launcher/TGC_Staff_Launcher_v1.1.5_Required_Logging_Warning.zip",
             "TGC_Staff_Launcher_Package/tgc_staff_node.py",[(1,35),(320,350),(730,805)]),
          ]
          for label,archive,filename,ranges in inputs:
            with zipfile.ZipFile(archive) as z:
              if filename not in z.namelist():
                print(label, "EXPECTED FILE MISSING",filename, "PY FILES",[x for x in z.namelist() if x.endswith(".py")])
                continue
              lines=z.read(filename).decode("utf-8").splitlines()
              print("\nPACKAGE",label,"FILENAME",filename,"LINES",len(lines))
              for a,b in ranges:
                print("----- LINES",a,b)
                for k in range(a-1,min(len(lines),b)):
                  print(f"{k+1:04d}: {lines[k]}")
          PY
