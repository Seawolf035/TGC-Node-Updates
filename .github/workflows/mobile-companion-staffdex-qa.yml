name: StaffDex roster and personalization QA (non-publishing)

on:
  push:
    branches:
      - feature/mobile-v0.20-staffdex-and-themes
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/mobile-companion-staffdex-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate roster source, no fake group ranks, privileges and release UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          repo=(root/'StaffDirectoryRepository.java').read_text()
          directory=(root/'StaffDirectoryActivity.java').read_text()
          profile=(root/'VRChatDetailActivity.java').read_text()
          api=(root/'VRChatApi.java').read_text()
          theme=(root/'ThemePreferences.java').read_text()
          editor=(root/'ThemeEditorActivity.java').read_text()
          style=(root/'CompanionStyle.java').read_text()
          main=(root/'CompanionActivity.java').read_text()
          news=(root/'WhatsNewActivity.java').read_text()
          manifest=Path('mobile-node-lab/mobile/src/main/AndroidManifest.xml').read_text()
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'AKfycbx0MRdKsYmz1B82M3KYZ28_fcyTrdavMTsTxNkLm2-ijyXAaR-1hbpa2fhDB_zXZAmrCg/exec?format=json' in repo
          assert 'readRoster()' in repo and 'json.optJSONArray("members")' in repo
          assert '"discordId"' in repo and '"vrchatUserId"' in repo
          assert '"displayRole"' in repo and '"isRoyalty"' in repo
          assert 'row.optString("vrchatUrl","")' in repo
          assert 'VRChatApi.friendsPage' in repo
          assert 'VRChatApi.currentUser' in repo
          assert 'VRChatApi.groupMembers' not in repo
          assert 'VRChatApi.searchGroups' not in repo
          assert 'VRChatApi.groupMember' not in repo
          assert 'VRChatApi.groupRoles' not in repo
          assert 'VRChatApi.groupRoles' not in api
          assert '!e.canFriend()' in directory and 'e.canFriend()&&!e.friend' in directory
          assert 'Send friend request' in directory and 'confirmRequest' in directory
          assert 'Half the Roster' in directory and 'Gotta Add' in directory
          assert 'StaffDirectoryRepository.rankLive' in profile
          assert 'ThemePreferences.royalGold()' in profile
          assert 'StaffGate.rankTier(c)>=4' in theme
          assert 'StaffGate.rankTier(c)>=7' in style
          assert 'ThemePreferences.color' in editor and 'ThemePreferences.preset' in editor
          assert 'WhatsNewActivity.shouldShow' in main and '"Theme Studio"' in main
          assert 'BuildConfig.VERSION_NAME' in news and 'markSeen(this)' in news
          for name in ['StaffDirectoryActivity','ThemeEditorActivity','WhatsNewActivity']:
              assert '<activity android:name=".'+name+'" android:exported="false"/>' in manifest
          assert "versionCode 70" in gradle and "versionName '0.20.0'" in gradle
          print('PASS: StaffDex uses authoritative roster; Royalty uses roster isRoyalty; VRChat only friendships; Admin+ themes and one-time changelog wired.')
          PY
      - name: Verify deployed read-only roster JSON is reachable and typed
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url="https://script.google.com/macros/s/AKfycbx0MRdKsYmz1B82M3KYZ28_fcyTrdavMTsTxNkLm2-ijyXAaR-1hbpa2fhDB_zXZAmrCg/exec?format=json"
          request=urllib.request.Request(url,headers={"User-Agent":"TGC-Staff-Companion/Roster","Accept":"application/json"})
          with urllib.request.urlopen(request,timeout=18) as resp:
              assert resp.status==200
              body=resp.read(1000001)
          assert len(body)<=1000000
          obj=json.loads(body.decode("utf-8"))
          assert obj.get("ok",True) is True
          members=obj.get("members",obj.get("staff"))
          assert isinstance(members,list) and members, "Live roster returned no staff"
          sample=members[0]
          assert "discordId" in sample and "role" in sample and "username" in sample
          assert "vrchatUserId" in sample or "vrchatUrl" in sample
          print("PASS: deployed official TGC staff roster returned",len(members),"members with supported identity fields.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android debug APK (never publish)
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
