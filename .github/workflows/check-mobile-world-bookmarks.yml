name: Validate Android v0.18.2 world bookmarks

on:
  push:
    branches:
      - feature/mobile-v0.18.2-world-bookmarks
    paths:
      - "mobile-node-lab/mobile/**"
      - ".github/workflows/check-mobile-world-bookmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android debug
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TGC-Staff-Companion-v0.18.2-World-Bookmarks-Debug
          path: mobile-node-lab/mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
