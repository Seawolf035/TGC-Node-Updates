name: Companion Settings and Friends parity QA (nonpublishing)

on:
  push:
    branches:
      - feature/mobile-v0.21.11-staffdex-achievements
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/mobile-companion-settings-parity-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert shared Friends data and no removed settings controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab")
          browse=(p/"VRChatBrowseActivity.java").read_text()
          settings=(p/"CompanionActivity.java").read_text()
          assert 'VRChatApi.friendSnapshot(this)' in browse
          assert 'CompanionCache.saveArray(this,"friends",all)' in browse
          assert 'pinnedOnly' in browse
          assert 'FriendPinStore.setPinned' in browse
          assert 'item.optString("location","")' in browse
          assert 'settingsPanel("account"' in settings
          assert 'settingsPanel("notifications"' in settings
          assert 'settingsPanel("friends"' in settings
          assert 'settingsPanel("tools"' in settings
          assert 'settingsPanel("app"' in settings
          for method in ('toggleCompanionUpdateAlerts','toggleInboxAlerts',
               'toggleLiveInbox','toggleAutoInviteRequests',
               'togglePinnedFriendAlerts','toggleOverlay',
               'chooseOverlaySize','toggleOverlayRecovery',
               'showBackgroundHealth','openAndroidNotificationSettings'):
            assert 'this::'+method in settings or 'this::'+method+';' in settings or method+'(' in settings,method
          pGM=(p/"GamerMusicProfiles.java").read_text()
          dex=(p/"StaffDexPanel.java").read_text()
          catalog=(p/"SpecialStaffDexAchievements.java").read_text()
          directory=(p/"StaffDirectoryRepository.java").read_text()
          prof=(p/"VRChatDetailActivity.java").read_text()
          mini=(p/"OverlayMiniVrcx.java").read_text()
          assert 'usr_7e47ea74-6034-48a1-8e8d-32e6bf8b0060' in pGM # GM1
          assert 'usr_5a0bd6d8-25c6-4a7b-a1a6-9ea85125398f' in pGM # GM2
          assert 'usr_677c17a0-a615-4dfd-907a-86706f06cc98' in pGM # GM3
          assert 'usr_bc1178b2-e5ad-40d5-a632-31acd5165416' in pGM # GM4
          assert 'Gamer Music Jr' in pGM and 'excluded' in pGM
          assert 'Gamer Music 2' not in dex or 'Cult' in dex
          assert 'Initiated into the Cult' in dex
          assert 'Gamer Music: Complete Discography' in dex
          assert 'Royal Flush' in dex and 'Owners' in dex
          assert 'The Entire Upper Deck' in dex
          for id in (
            'usr_ff419c82-c92b-4494-b821-035d33253ef0',
            'usr_b85631a8-5e23-4b88-a14b-4c8a2ae863c1',
            'usr_2a833076-03ac-4212-aeff-0708d8eab968',
            'usr_3f229b32-5059-4889-af22-a98203d7a2b3',
            'usr_f430e93d-d7f4-4e23-a0e9-e332f2228dff',
            'usr_740ff8b0-6d49-4b38-b28b-a45f33ea8ef9',
            'usr_cd566dbc-b21d-4a84-9548-4767128f0bec'
          ):
            assert id in catalog,id
          assert 'snapshot.friendsComplete' in catalog
          assert 'friendIds.contains(vrchatId)' in directory
          assert 'GamerMusicProfiles.decorate(this,id' in prof
          assert 'GamerMusicProfiles.name(id)' in mini
          assert 'friend_favorite_groups' in browse
          assert 'favoriteFriendGroupContents' in browse
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'versionCode 85' in gradle and "versionName '0.21.11'" in gradle
          news=(p/"WhatsNewActivity.java").read_text()
          versions=[line.split('RELEASE · ')[1].split('"')[0]
            for line in news.splitlines() if 'RELEASE · v0.' in line]
          assert versions==['v0.21.11','v0.21.10','v0.21.9','v0.21.8','v0.21.7'],versions
          assert 'non-staff' not in news.lower() and 'delegated' not in news.lower()
          assert 'AJ · The Chairman' in dex
          assert 'Asriel · The Spawn of Lily and Seawolf' in dex
          assert 'Seawolf · The Founder' in dex and 'Lily · The Lil shit' in dex
          assert 'Imposter · Sus' in dex and 'Gamewitch · The Mysterious One' in dex
          assert 'Seawolf & Lily · Two Hearts' in dex
          assert 'int totalSpecial=16' in dex
          assert 'leadershipEarned,10' in dex
          for key in ('basic','gm','leaders','rare'):
            assert 'categoryHeader("'+key+'"' in dex
          assert 'expandedAchievements=new HashSet<>()' in dex
          assert 'categoryHeader("special"' not in dex
          print('PASS: Settings/Friends parity, 16 compact StaffDex achievements, release v0.21.11')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile entire Android app without publishing or signing
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
