name: Build Staff Launcher 1.1.2

on:
  push:
    paths:
      - ".release-parts/staff/v1.1.2/READY"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Staff Launcher 1.1.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_staff_112
          mkdir -p build_staff_112
          unzip -q updates/staff-launcher/TGC_Staff_Launcher_v1.1.1_GitHub_Updater.zip -d build_staff_112
          cd build_staff_112/TGC_Staff_Launcher_Package
          patch -p0 < ../../.release-tools/staff-launcher-v1.1.2.patch
          sed -i 's/TGC STAFF LAUNCHER v1.1.0/TGC STAFF LAUNCHER v1.1.2/' README_FIRST.txt
          printf '%s\n' '' 'SINGLE VR INSTANCE (v1.1.2+)' '----------------------------' 'On the Instances tab, select Use VR on at most one of the three slots.' 'The selected slot launches normally for SteamVR. Every other slot is' 'explicitly forced into Desktop mode with VRChat --no-vr.' '' 'Changing the selection applies the next time that instance launches or restarts.' >> README_FIRST.txt
          printf '%s\n' 'TGC Staff Launcher v1.1.2 - Single VR Instance' '================================================' '' '- Keeps the launcher hard-limited to three local clients.' '- Adds Use VR to each instance row; only one may be selected.' '- Adds Desktop Only to force all three clients into Desktop mode.' '- Non-selected clients use VRChat --no-vr.' '- The selected VR slot launches without --no-vr for SteamVR.' '- The choice is saved and preserved through GitHub self-updates.' '- Verification and the embedded Invite Node remain required.' > V1_1_2_SINGLE_VR_INSTANCE.txt
          python -m py_compile TGC_Staff_Launcher.py tgc_staff_node.py tgc_vrchat_multilog.py staff_launcher_update_helper.py
          grep -q 'APP_VERSION = "1.1.2"' TGC_Staff_Launcher.py
          grep -q '"vr_instance": 0' TGC_Staff_Launcher.py
          grep -q 'text="Use VR"' TGC_Staff_Launcher.py
          grep -q 'text="Desktop Only"' TGC_Staff_Launcher.py
          grep -q 'args.append("--no-vr")' TGC_Staff_Launcher.py
          grep -q 'UPDATE_CHANNEL = "staff_launcher"' TGC_Staff_Launcher.py
          grep -q 'This deployment is not a Staff Launcher deployment.' TGC_Staff_Launcher.py
          cd ../..
          mkdir -p updates/staff-launcher
          rm -f updates/staff-launcher/TGC_Staff_Launcher_v1.1.2_Single_VR_Instance.zip
          cd build_staff_112
          zip -qr ../updates/staff-launcher/TGC_Staff_Launcher_v1.1.2_Single_VR_Instance.zip TGC_Staff_Launcher_Package -x "*/__pycache__/*" "*.pyc"
          cd ..

      - name: Publish Staff Launcher 1.1.2
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import hashlib,json,pathlib; z=pathlib.Path("updates/staff-launcher/TGC_Staff_Launcher_v1.1.2_Single_VR_Instance.zip"); sha=hashlib.sha256(z.read_bytes()).hexdigest(); p=pathlib.Path("manifest.json"); m=json.loads(p.read_text()); m.setdefault("releases",{})["staff_launcher"]={"channel":"staff_launcher","version":"1.1.2","url":"https://raw.githubusercontent.com/Seawolf035/TGC-Node-Updates/main/updates/staff-launcher/TGC_Staff_Launcher_v1.1.2_Single_VR_Instance.zip","sha256":sha,"policy":"recommended","notes":"Adds a selectable single VR client. One of the three Staff Launcher instances can run normally for SteamVR while every other instance is forced Desktop with --no-vr.","published_at":"2026-10-10T20:05:00Z"}; p.write_text(json.dumps(m,indent=2)+"\n"); print(sha)'
          git config user.name "TGC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates/staff-launcher/TGC_Staff_Launcher_v1.1.2_Single_VR_Instance.zip manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Staff Launcher 1.1.2 single VR instance"
            git push
          fi
