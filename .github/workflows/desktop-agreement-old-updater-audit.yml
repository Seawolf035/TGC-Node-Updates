name: Audit old desktop required-update behavior (read only)
on:
  push:
    branches: [feature/desktop-mandatory-agreement-v1]
    paths: [.github/workflows/desktop-agreement-old-updater-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import zipfile
          inputs=[
          ("STANDALONE","updates/standalone/TGC_Invite_Node_v1.1.10_Required_Update.zip","tgc_invite_node.py",[(802,881),(880,940)]),
          ("PLUGIN","updates/plugin/TGC_Invite_Node_Plugin_v1.1.10-plugin_Required_Update.zip","plugins/distributed_invite_node.py",[(1078,1140)]),
          ("STAFF","updates/staff-launcher/TGC_Staff_Launcher_v1.1.5_Required_Logging_Warning.zip","TGC_Staff_Launcher_Package/TGC_Staff_Launcher.py",[(470,566),(600,665)]),
          ]
          for kind,archive,source,ranges in inputs:
            with zipfile.ZipFile(archive) as z:
              lines=z.read(source).decode("utf-8").splitlines()
            print("=====",kind)
            for a,b in ranges:
              print("---",a,b)
              for i in range(a-1,min(len(lines),b)):
                print(f"{i+1}: {lines[i]}")
          PY
