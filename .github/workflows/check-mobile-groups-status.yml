name: Validate Player Groups and Status Options v0.19.6

on:
  push:
    branches:
      - feature/mobile-v0.19.6-user-groups-no-offline-status
    paths:
      - 'mobile-node-lab/mobile/**'
      - 'mobile-node-lab/QUEST_v0.19.6_GROUPS_STATUS_QA.md'
      - '.github/workflows/check-mobile-groups-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify visible-group privacy boundaries and no Offline selection
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          groups=(base/'VRChatUserGroupsActivity.java').read_text()
          profile=(base/'VRChatDetailActivity.java').read_text()
          api=(base/'VRChatApi.java').read_text()
          presence=(base/'PresenceActivity.java').read_text()
          tools=(base/'OverlayMiniVrcx.java').read_text()
          manifest=Path('mobile-node-lab/mobile/src/main/AndroidManifest.xml').read_text()
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'VRChatApi.visibleUserGroups(this,target)' in groups
          assert 'String groupId=membership.optString("groupId","")' in groups
          assert 'String groupId=membership.optString("groupId","")' in groups
          assert 'HashSet<String> seen=new HashSet<>()' in groups
          assert 'hidden' in groups.lower()
          assert 'new Intent(VRChatUserGroupsActivity.this,VRChatDetailActivity.class)' in groups
          assert 'user_id' in groups and 'user_name' in groups
          assert 'View all visible groups' in profile
          assert 'Math.min(groups.length(),5)' in profile
          assert 'VRChatUserGroupsActivity.class' in profile
          assert '"/users/"+userId+"/groups"' in api
          assert 'if(!status.matches("active|ask me|busy|join me"))' in api
          assert '{"active","join me","ask me","busy"}' in presence
          assert '{"active","join me","ask me","busy"}' in tools
          assert 'case "mini_user_groups":' in tools
          assert 'VRChatApi.visibleUserGroups(ctx,groupSubjectUserId)' in tools
          assert 'VRChatUserGroupsActivity.visibleGroup(' in tools
          assert 'button(info,"View visible groups"' in tools
          assert 'supported?"Load preset":"Status unavailable"' in presence
          assert 'use.setEnabled(supported)' in presence
          assert 'Offline friends' in (base/'CompanionActivity.java').read_text()
          assert 'android:name=".VRChatUserGroupsActivity" android:exported="false"' in manifest
          assert 'versionCode 58' in gradle and "versionName '0.19.6'" in gradle
          print('Groups browser, visibility, safe status mutations and legacy preset controls passed.')
          PY
      - name: Compile Android APK
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
