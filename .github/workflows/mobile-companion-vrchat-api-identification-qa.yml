name: QA Android Companion VRChat API identification (no publishing)
on:
  push:
    branches:
      - feature/mobile-vrchat-api-identification
  pull_request:
    branches:
      - experiment/mobile-node-lab
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-api-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Guard app identity, API headers, published notes and retained highlights
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab/VRChatApi.java').read_text()
          gradle = Path('mobile-node-lab/mobile/build.gradle').read_text()
          news = Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab/WhatsNewActivity.java').read_text()
          workflow = Path('.github/workflows/build-experimental-mobile-apk.yml').read_text()
          code=int(re.search(r'versionCode\s+(\d+)',gradle).group(1))
          patch=int(re.search(r"versionName '0\.21\.(\d+)'",gradle).group(1))
          assert code>=95 and patch>=21
          assert '"TGC-Staff-Companion/"+BuildConfig.VERSION_NAME+" masonswan@usa.com"' in src
          assert 'conn.setRequestProperty("User-Agent",AGENT)' in src
          assert 'TGC-Staff-Companion/1.0.0' not in src
          assert [int(v) for v in re.findall(r'(?:LATEST RELEASE|PREVIOUS STAFF RELEASE) · v0\.21\.(\d+)',news)] == list(range(patch,patch-5,-1))
          assert '"notes":' in workflow
          assert 'masonswan@usa.com' not in workflow
          print('PASS: source-level VRChat API identification, current version, no sensitive publisher details, five-patch history')
          PY
      - name: Compile complete Android debug app (no signing or publishing)
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
