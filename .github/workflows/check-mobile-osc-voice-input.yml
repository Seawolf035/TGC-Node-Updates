name: Validate v0.18.4 experimental OSC PTT

on:
  push:
    branches:
      - feature/mobile-v0.18.4-experimental-osc-voice
    paths:
      - "mobile-node-lab/mobile/**"
      - ".github/workflows/check-mobile-osc-voice-input.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check OSC PTT wire format and safety paths
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          osc=(root/'VRChatOscChat.java').read_text()
          overlay=(root/'FloatingCompanionService.java').read_text()
          assert 'oscString(out,"/input/Voice")' in osc
          assert 'oscString(out,",i")' in osc
          assert 'writeInt(pressed?1:0)' in osc
          assert 'sendVoiceInput(boolean pressed)' in osc
          assert 'sendOscVoiceHold(!oscVoiceHoldRequested)' in overlay
          assert 'oscVoiceQuickRelease' in overlay
          assert 'oscVoiceSafety' in overlay and '300_000L' in overlay
          assert overlay.count('releaseOscVoiceOnExit();') >= 2
          assert 'Send emergency PTT RELEASE (0)' in overlay
          assert 'versionCode 47' in Path('mobile-node-lab/mobile/build.gradle').read_text()
          print('OSC input formatting, emergency release and build 47 checked')
          PY
      - name: Compile debug APK
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TGC-Staff-Companion-v0.18.4-OSC-PTT-Experimental-Debug
          path: mobile-node-lab/mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
