name: Publish required Invite Nodes v1.1.9
on:
  push:
    paths:
      - ".release-parts/nodes/v1.1.9/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and validate both Node packages
        run: python release-tools/build_nodes_v119.py
      - name: Commit v1.1.9 ZIPs and required GitHub manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TGC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            updates/standalone/TGC_Invite_Node_v1.1.9_Required_Update.zip \
            updates/plugin/TGC_Invite_Node_Plugin_v1.1.9-plugin_Required_Update.zip \
            manifest.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "release: required v1.1.9 Node tracking diagnostics"
          git push
