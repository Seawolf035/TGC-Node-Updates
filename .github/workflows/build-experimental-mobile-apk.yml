name: Build TGC Staff Companion with verified updates

on:
  push:
    branches:
      - experiment/mobile-node-lab
    paths:
      - 'mobile-node-lab/mobile/**'
      - 'mobile-node-lab/build.gradle'
      - 'mobile-node-lab/gradle.properties'
      - 'mobile-node-lab/settings.gradle'
      - '.github/workflows/build-experimental-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgc-mobile-companion-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SIGN_KEY_B64: ${{ secrets.TGC_ANDROID_RELEASE_KEYSTORE_B64 }}
      SIGN_STORE_PASS: ${{ secrets.TGC_ANDROID_RELEASE_STORE_PASSWORD }}
      SIGN_ALIAS: ${{ secrets.TGC_ANDROID_RELEASE_KEY_ALIAS }}
      SIGN_KEY_PASS: ${{ secrets.TGC_ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Require complete permanent Android signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for var in SIGN_KEY_B64 SIGN_STORE_PASS SIGN_ALIAS SIGN_KEY_PASS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Permanent Android signing credentials are incomplete ($var)."
              exit 1
            fi
          done
          echo "All required signing credentials present (values not displayed)."
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble diagnostic preview APK
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
      - name: Import encrypted release signer
        if: env.SIGN_KEY_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGN_KEY_B64" | base64 -d > "$RUNNER_TEMP/tgc-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/tgc-companion-release.jks"
      - name: Build stable-key signed release APK
        if: env.SIGN_KEY_B64 != ''
        working-directory: mobile-node-lab
        env:
          TGC_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/tgc-companion-release.jks
          TGC_ANDROID_KEYSTORE_PASSWORD: ${{ env.SIGN_STORE_PASS }}
          TGC_ANDROID_KEY_ALIAS: ${{ env.SIGN_ALIAS }}
          TGC_ANDROID_KEY_PASSWORD: ${{ env.SIGN_KEY_PASS }}
        run: gradle :mobile:assembleRelease --no-daemon --stacktrace
      - name: Verify permanent signing identity and upgrade compatibility
        if: env.SIGN_KEY_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          new=mobile-node-lab/mobile/build/outputs/apk/release/mobile-release.apk
          old=mobile-node-lab/downloads/TGC_Staff_Companion_Release.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose "$new"
          if [ -f "$old" ]; then
            previous=$("$signer" verify --print-certs "$old" | sed -nE 's/^Signer #1 certificate SHA-256 digest: (.*)$/\1/p' | head -n1)
            current=$("$signer" verify --print-certs "$new" | sed -nE 's/^Signer #1 certificate SHA-256 digest: (.*)$/\1/p' | head -n1)
            test -n "$previous" && test -n "$current"
            if [ "$previous" != "$current" ]; then
              echo "::error::Signing certificate changed: refusing to publish an incompatible APK."
              exit 1
            fi
            echo "Signed release certificate matches existing published APK."
          fi
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          current=Path("mobile-node-lab/mobile/build.gradle").read_text()
          code=int(re.search(r"versionCode\s+(\d+)",current).group(1))
          published=json.loads(Path("mobile-node-lab/mobile-update.json").read_text())
          assert code > int(published["version_code"]), "Release versionCode must increase"
          print("Upgrade versionCode verified.")
          PY
      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: TGC-Staff-Companion-Preview
          path: mobile-node-lab/mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
      - name: Upload stable-key signed release
        if: env.SIGN_KEY_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: TGC-Staff-Companion-Signed
          path: mobile-node-lab/mobile/build/outputs/apk/release/mobile-release.apk
          if-no-files-found: error
      - name: Publish APKs and stable-release feed
        shell: bash
        env:
          RELEASE_SIGNING_READY: ${{ env.SIGN_KEY_B64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p mobile-node-lab/downloads
          gradle_file=mobile-node-lab/mobile/build.gradle
          version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'.*/\1/p" "$gradle_file" | head -n1)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' "$gradle_file" | head -n1)
          test -n "$version" && test -n "$version_code"
          cp mobile-node-lab/mobile/build/outputs/apk/debug/mobile-debug.apk \
            "mobile-node-lab/downloads/TGC_Staff_Companion_v${version}_Preview.apk"
          if [ -n "$SIGN_KEY_B64" ]; then
            apk=mobile-node-lab/mobile/build/outputs/apk/release/mobile-release.apk
            cp "$apk" mobile-node-lab/downloads/TGC_Staff_Companion_Release.apk
            digest=$(sha256sum "$apk" | cut -d' ' -f1)
            cat > mobile-node-lab/mobile-update.json <<JSON
          {
            "schema": 1,
            "channel": "mobile_companion",
            "version": "$version",
            "version_code": $version_code,
            "apk_url": "https://raw.githubusercontent.com/Seawolf035/TGC-Node-Updates/experiment/mobile-node-lab/mobile-node-lab/downloads/TGC_Staff_Companion_Release.apk",
            "sha256": "$digest",
            "notes": "v0.20.1 (code 71): Admin+ Theme Studio supports direct #RRGGBB hex entry for all editable UI channels and import/export of six-color VRChat UI palettes in the order Highlight, Icons, Buttons, Background, Fonts, Subtext. Accept comma-separated or line-separated codes; validate all six before atomically saving locally, keep sliders synchronized with hex and render a live color preview. Map icon, button, primary font, and subtext channels distinctly while deriving readable card, panel, input and border tones. Added copy-to-clipboard of the current theme in VRChat six-code format. Personal palettes are NOT added to built-in presets; the existing five presets remain unchanged, and previous 0.20.0 themes migrate without losing accent overrides. Royalty gold profile identity stays independent from a user's personal palette. Preserve StaffDex sourced exclusively from the official TGC roster, authenticated VRChat friendship checks, verified Admin+ gate, staff-facing What's New and fully Seawolf-attributed agreement 2026-10-14.2. In-place update only; no new permissions, data wipe, Main Launcher or Relay changes."
          }
          JSON
          fi
          git config user.name "TGC Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile-node-lab/downloads mobile-node-lab/mobile-update.json 2>/dev/null || git add mobile-node-lab/downloads
          git commit -m "build: publish companion APK [skip ci]" || exit 0
          git fetch origin experiment/mobile-node-lab
          git rebase origin/experiment/mobile-node-lab
          git push origin HEAD:experiment/mobile-node-lab
      - name: Delete signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tgc-companion-release.jks"
