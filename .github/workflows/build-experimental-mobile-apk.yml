name: Build TGC Staff Companion preview APK

on:
  push:
    branches:
      - experiment/mobile-node-lab
    paths:
      - 'mobile-node-lab/**'
      - '.github/workflows/build-experimental-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug APK
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TGC-Staff-Companion-v0.4-APK
          path: mobile-node-lab/mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
      - name: Publish APK for direct download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-node-lab/downloads
          cp mobile-node-lab/mobile/build/outputs/apk/debug/mobile-debug.apk \
             mobile-node-lab/downloads/TGC_Staff_Companion_v0.4_Preview.apk
          git config user.name "TGC Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile-node-lab/downloads/TGC_Staff_Companion_v0.4_Preview.apk
          git commit -m "build: publish mobile node lab v0.3 APK" || exit 0
          git push origin HEAD:experiment/mobile-node-lab
