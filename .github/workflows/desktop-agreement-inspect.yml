name: Inspect desktop package startup and agreement integration (read only)
on:
  push:
    branches: [feature/desktop-mandatory-agreement-v1]
    paths: [.github/workflows/desktop-agreement-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current official release ZIP source (no changes to artifacts)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, re, hashlib
          packages={
            "STANDALONE":Path("updates/standalone/TGC_Invite_Node_v1.1.10_Required_Update.zip"),
            "PLUGIN":Path("updates/plugin/TGC_Invite_Node_Plugin_v1.1.10-plugin_Required_Update.zip"),
            "STAFF":Path("updates/staff-launcher/TGC_Staff_Launcher_v1.1.5_Required_Logging_Warning.zip"),
          }
          for kind,path in packages.items():
            print("\n===== PACKAGE",kind,"ZIP",path,"SIZE",path.stat().st_size,"=====",flush=True)
            with zipfile.ZipFile(path) as z:
              print("ENTRIES",[(i.filename,i.file_size) for i in z.infolist()])
              for name in z.namelist():
                if not name.lower().endswith((".py",".bat",".json",".md",".txt")):continue
                data=z.read(name).decode("utf-8",errors="replace")
                if "PRIVATE KEY" in data or "ghp_" in data:print("POTENTIAL SECRET!",name)
                if len(data)>220000:print("FILE TOO LARGE",name);continue
                lines=data.splitlines()
                print("\n===FILE",name,"lines",len(lines),"sha256",hashlib.sha256(data.encode()).hexdigest(),"===")
                if name.endswith(".py"):
                  hits=[(i+1,l) for i,l in enumerate(lines) if re.match(r'^\s*(?:class |def |if __name__|if\s+__name__|root\s*=|app\s*=|tk\.Tk\(|Tk\(|main\(|VERSION\s*=|APP_VERSION\s*=|NODE_VERSION\s*=)',l) or re.search(r'(?i)update|start\(|__init__|withdraw|destroy|plugin|mainloop|run\(|gui|launch',l) and re.match(r'^\s*def ',l)]
                  print("SYMBOLS",hits[:150])
                  for i,line in enumerate(lines):
                    if re.search(r'if __name__\s*==|mainloop\(|def main\(|def launch\(|def __init__\(|def start\(|class .*App\b|class .*Launcher\b',line):
                      a=max(0,i-3);b=min(len(lines),i+24)
                      print("CONTEXT",i+1,repr("\n".join(str(j+1)+":"+lines[j] for j in range(a,b))[:2500]))
                else:
                  if any(term in name.lower() for term in ("readme","run","start","license","requirements","manifest")):
                    print("TEXT_HEAD",repr(data[:4000]))
          PY
