name: Co-Companion owner preview build and release

on:
  push:
    branches: [feature/co-companion-foundation]
    paths:
      - 'co-companion/**'
      - '.github/workflows/co-companion-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install profile image decoder for offline rendering checks
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Compile foundation modules
        run: python -m compileall -q co-companion/tgc_cocompanion co-companion/tests
      - name: Test without network or VRChat
        env:
          PYTHONPATH: co-companion
        run: python -m unittest discover -s co-companion/tests -p 'test_*.py' -v

  windows-offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install profile image decoder for offline rendering checks
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Compile all Windows Co-Companion modules and tests
        run: python -m compileall -q co-companion/tgc_cocompanion co-companion/tests
      - name: Offline unit and Tk interface tests on Windows 3.13
        env:
          PYTHONPATH: co-companion
        run: python -m unittest discover -s co-companion/tests -p "test_*.py" -v
      - name: Validate Windows DPAPI/process dependencies
        run: |
          python -m pip install --disable-pip-version-check -r co-companion/requirements_owner_pilot.txt
          python -c "import tkinter, psutil, win32crypt, PIL.Image, PIL.ImageTk; print('Windows UI, profile artwork, DPAPI and process dependencies available')"
      - name: Generate pinned owner-preview build metadata
        shell: pwsh
        run: |
          $version = (Get-Content "co-companion/OWNER_VERSION.txt" -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$') { throw "Invalid owner EXE version" }
          $info = @{ channel = "owner-preview"; version = $version; sha = "$env:GITHUB_SHA"; run_id = [int64]$env:GITHUB_RUN_ID }
          $info | ConvertTo-Json -Compress | Set-Content "co-companion/build_info.json" -Encoding utf8
      - name: Assemble manually runnable owner-preview source ZIP (no credentials)
        shell: pwsh
        run: |
          $root = "owner-preview-source"
          New-Item -ItemType Directory -Path "$root/tgc_cocompanion/legacy" -Force | Out-Null
          $source = "co-companion/tgc_cocompanion"
          Get-ChildItem -Path $source -Filter '*.py' -File | ForEach-Object { Copy-Item $_.FullName "$root/tgc_cocompanion/$($_.Name)" -ErrorAction Stop }
          Get-ChildItem -Path "$source/legacy" -Filter '*.py' -File | ForEach-Object { Copy-Item $_.FullName "$root/tgc_cocompanion/legacy/$($_.Name)" -ErrorAction Stop }
          Copy-Item "co-companion/owner_pilot_entry.py" "$root/owner_pilot_entry.py"
          Copy-Item "co-companion/build_info.json" "$root/build_info.json"
          Copy-Item "co-companion/TGC_DESKTOP_TERMS.txt" "$root/TGC_DESKTOP_TERMS.txt"
          Copy-Item "co-companion/requirements_owner_pilot.txt" "$root/requirements_owner_pilot.txt"
          Copy-Item "co-companion/RUN_OWNER_PILOT.bat" "$root/RUN_OWNER_PILOT.bat"
          Copy-Item "co-companion/README_OWNER_PILOT.md" "$root/README_OWNER_PILOT.md"
          $version = (Get-Content "co-companion/OWNER_VERSION.txt" -Raw).Trim()
          Compress-Archive -Path "$root/*" -DestinationPath "TGC_CoCompanion_OwnerPreview_v${version}_SOURCE.zip" -CompressionLevel Optimal -Force
          if (!(Test-Path "TGC_CoCompanion_OwnerPreview_v${version}_SOURCE.zip")) { throw "Source package missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: TGC-CoCompanion-OWNER-SOURCE-NOT-STAFF
          path: TGC_CoCompanion_OwnerPreview_v*_SOURCE.zip
          retention-days: 14
      - name: Compile self-contained Windows owner-preview executable
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.16,<7"
          python -m PyInstaller --noconfirm --clean --onedir --console --name TGC_CoCompanion_OwnerPreview --paths co-companion --add-data "co-companion/TGC_DESKTOP_TERMS.txt;." --add-data "co-companion/build_info.json;." --hidden-import win32crypt --hidden-import psutil co-companion/owner_pilot_entry.py
          if (!(Test-Path "dist/TGC_CoCompanion_OwnerPreview/TGC_CoCompanion_OwnerPreview.exe")) { throw "Windows executable missing" }
          & "dist/TGC_CoCompanion_OwnerPreview/TGC_CoCompanion_OwnerPreview.exe" --smoke-check
          if ($LASTEXITCODE -ne 0) { throw "Bundled owner-preview EXE failed GUI smoke test" }
          Copy-Item "co-companion/build_info.json" "dist/TGC_CoCompanion_OwnerPreview/build_info.json"
          python -c "import json, pathlib; a=json.loads(pathlib.Path('dist/TGC_CoCompanion_OwnerPreview/build_info.json').read_text(encoding='utf-8-sig')); assert a['sha']=='$env:GITHUB_SHA'; print('Verified build provenance:',a['sha'])"
          Copy-Item "co-companion/README_OWNER_PILOT.md" "dist/TGC_CoCompanion_OwnerPreview/README_OWNER_PILOT.md"
          $version = (Get-Content "co-companion/OWNER_VERSION.txt" -Raw).Trim()
          Compress-Archive -Path "dist/TGC_CoCompanion_OwnerPreview/*" -DestinationPath "TGC_CoCompanion_OwnerPreview_v${version}_WINDOWS.zip" -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TGC-CoCompanion-OWNER-EXE-NOT-STAFF
          path: TGC_CoCompanion_OwnerPreview_v*_WINDOWS.zip
          retention-days: 14

  owner-exe-release:
    name: Publish owner-only EXE after green CI
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/co-companion-foundation' }}
    needs: [offline-tests, windows-offline-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TGC-CoCompanion-OWNER-EXE-NOT-STAFF
          path: verified-owner-build
      - name: Verify published artifact and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < co-companion/OWNER_VERSION.txt)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          artifact="verified-owner-build/TGC_CoCompanion_OwnerPreview_v${version}_WINDOWS.zip"
          test -s "$artifact"
          python3 - "$artifact" "$version" <<'PY'
          import json, pathlib, sys, zipfile
          path, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          with zipfile.ZipFile(path) as package:
              names=set(package.namelist())
              required={'TGC_CoCompanion_OwnerPreview.exe','build_info.json'}
              if not required.issubset(names) or not any(x.startswith('_internal/') for x in names):
                  raise SystemExit('Missing owner EXE/runtime files')
              info=json.loads(package.read('build_info.json').decode('utf-8-sig'))
              if info.get('channel')!='owner-preview' or info.get('version')!=version or info.get('sha') != __import__('os').environ['GITHUB_SHA']:
                  raise SystemExit('Owner build is not from this green CI commit/version')
              if package.testzip() is not None:
                  raise SystemExit('Owner EXE ZIP has corrupt members')
          PY
          sha256sum "$artifact"
      - name: Publish or repair canonical owner EXE asset name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < co-companion/OWNER_VERSION.txt)"
          tag="co-companion-owner-v${version}"
          canonical="TGC-CoCompanion-OwnerPreview-WINDOWS.zip"
          legacy="TGC_CoCompanion_OwnerPreview_v${version}_WINDOWS.zip"
          archive="verified-owner-build/$legacy"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.target_commitish')"
            has_asset="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '[.assets[].name] | any(. == "TGC-CoCompanion-OwnerPreview-WINDOWS.zip")')"
            if [ "$has_asset" = "true" ]; then
              echo "Verified canonical asset already published; version bump required for new code."
              exit 0
            fi
            mkdir -p repair
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$legacy" --dir repair
            python3 - "repair/$legacy" "$existing" "$version" <<'PY'
          import json, pathlib, sys, zipfile
          path, sha, version = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          with zipfile.ZipFile(path) as archive:
              info=json.loads(archive.read('build_info.json').decode('utf-8-sig'))
              if info.get('sha')!=sha or info.get('version')!=version:
                  raise SystemExit('Refusing to rename an asset from a different verified commit')
              if archive.testzip() is not None:
                  raise SystemExit('Original release ZIP checksum failed')
          PY
            cp "repair/$legacy" "$canonical"
            gh release upload "$tag" "$canonical" --repo "$GITHUB_REPOSITORY"
            echo "Repaired existing release asset name while keeping original pinned commit $existing."
          else
            cp "$archive" "$canonical"
            gh release create "$tag" "$canonical" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "TGC Co-Companion v${version} Owner Preview (NOT STAFF)" \
              --notes "Checksum-verified Windows owner-only preview. Public GitHub release, but NOT a staff/Node/Relay/Main Launcher deployment. Owner verification still required at runtime."
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '{tag: .tag_name, commit: .target_commitish, assets: [.assets[] | {name: .name, digest: .digest, size: .size}]}'
