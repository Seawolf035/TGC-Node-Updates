name: Co-Companion foundation tests (nonpublishing)

on:
  push:
    branches: [feature/co-companion-foundation]
    paths:
      - 'co-companion/**'
      - '.github/workflows/co-companion-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile foundation modules
        run: python -m compileall -q co-companion/tgc_cocompanion co-companion/tests
      - name: Test without network or VRChat
        env:
          PYTHONPATH: co-companion
        run: python -m unittest discover -s co-companion/tests -p 'test_*.py' -v

  windows-offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all Windows Co-Companion modules and tests
        run: python -m compileall -q co-companion/tgc_cocompanion co-companion/tests
      - name: Offline unit and Tk interface tests on Windows 3.13
        env:
          PYTHONPATH: co-companion
        run: python -m unittest discover -s co-companion/tests -p "test_*.py" -v
      - name: Validate Windows DPAPI/process dependencies
        run: |
          python -m pip install --disable-pip-version-check -r co-companion/requirements_owner_pilot.txt
          python -c "import tkinter, psutil, win32crypt; print('Windows UI, DPAPI and process dependencies available')"
      - name: Generate pinned owner-preview build metadata
        shell: pwsh
        run: |
          $info = @{ channel = "owner-preview"; version = "0.4"; sha = "$env:GITHUB_SHA"; run_id = [int64]$env:GITHUB_RUN_ID }
          $info | ConvertTo-Json -Compress | Set-Content "co-companion/build_info.json" -Encoding utf8
      - name: Assemble manually runnable owner-preview source ZIP (no credentials)
        shell: pwsh
        run: |
          $root = "owner-preview-source"
          New-Item -ItemType Directory -Path "$root/tgc_cocompanion/legacy" -Force | Out-Null
          $source = "co-companion/tgc_cocompanion"
          $include = @("__init__.py", "permissions.py", "sessions.py", "osc.py", "staff_lease.py", "launch_controller.py", "windows_process.py", "log_diagnostics.py", "pilot_enrollment.py", "owner_pilot.py", "vrchat_personal.py", "staffdex_desktop.py", "desktop_osc_tools.py", "desktop_pages.py", "desktop_theme.py", "desktop_shell.py", "desktop_navigation.py", "desktop_settings.py", "desktop_update_page.py", "owner_updater.py", "python_source_updater.py", "desktop_more_pages.py", "desktop_collection_pages.py")
          foreach ($file in $include) { Copy-Item "$source/$file" "$root/tgc_cocompanion/$file" -ErrorAction Stop }
          Copy-Item "$source/legacy/__init__.py" "$root/tgc_cocompanion/legacy/__init__.py"
          Copy-Item "$source/legacy/tgc_vrchat_multilog.py" "$root/tgc_cocompanion/legacy/tgc_vrchat_multilog.py"
          Copy-Item "co-companion/owner_pilot_entry.py" "$root/owner_pilot_entry.py"
          Copy-Item "co-companion/build_info.json" "$root/build_info.json"
          Copy-Item "co-companion/TGC_DESKTOP_TERMS.txt" "$root/TGC_DESKTOP_TERMS.txt"
          Copy-Item "co-companion/requirements_owner_pilot.txt" "$root/requirements_owner_pilot.txt"
          Copy-Item "co-companion/RUN_OWNER_PILOT.bat" "$root/RUN_OWNER_PILOT.bat"
          Copy-Item "co-companion/README_OWNER_PILOT.md" "$root/README_OWNER_PILOT.md"
          Compress-Archive -Path "$root/*" -DestinationPath "TGC_CoCompanion_OwnerPreview_v0.4_SOURCE.zip" -CompressionLevel Optimal -Force
          if (!(Test-Path "TGC_CoCompanion_OwnerPreview_v0.4_SOURCE.zip")) { throw "Source package missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: TGC-CoCompanion-OWNER-SOURCE-NOT-STAFF
          path: TGC_CoCompanion_OwnerPreview_v0.4_SOURCE.zip
          retention-days: 14
      - name: Compile self-contained Windows owner-preview executable
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.16,<7"
          python -m PyInstaller --noconfirm --clean --onedir --console --name TGC_CoCompanion_OwnerPreview --paths co-companion --add-data "co-companion/TGC_DESKTOP_TERMS.txt;." --add-data "co-companion/build_info.json;." --hidden-import win32crypt --hidden-import psutil co-companion/owner_pilot_entry.py
          if (!(Test-Path "dist/TGC_CoCompanion_OwnerPreview/TGC_CoCompanion_OwnerPreview.exe")) { throw "Windows executable missing" }
          & "dist/TGC_CoCompanion_OwnerPreview/TGC_CoCompanion_OwnerPreview.exe" --smoke-check
          if ($LASTEXITCODE -ne 0) { throw "Bundled owner-preview EXE failed GUI smoke test" }
          Copy-Item "co-companion/build_info.json" "dist/TGC_CoCompanion_OwnerPreview/build_info.json"
          python -c "import json, pathlib; a=json.loads(pathlib.Path('dist/TGC_CoCompanion_OwnerPreview/build_info.json').read_text(encoding='utf-8-sig')); assert a['sha']=='$env:GITHUB_SHA'; print('Verified build provenance:',a['sha'])"
          Copy-Item "co-companion/README_OWNER_PILOT.md" "dist/TGC_CoCompanion_OwnerPreview/README_OWNER_PILOT.md"
          Compress-Archive -Path "dist/TGC_CoCompanion_OwnerPreview/*" -DestinationPath "TGC_CoCompanion_OwnerPreview_v0.4_WINDOWS.zip" -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TGC-CoCompanion-OWNER-EXE-NOT-STAFF
          path: TGC_CoCompanion_OwnerPreview_v0.4_WINDOWS.zip
          retention-days: 14
