name: Verify StaffDex expandable achievements v0.21.13 (nonpublishing)

on:
  push:
    branches:
      - feature/mobile-v0.21.13-staffdex-collection-summary
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/mobile-companion-staffdex-collapsible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all requested achievements, collapsible categories and patch history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab")
          panel=(base/"StaffDexPanel.java").read_text()
          names=(base/"SpecialStaffDexAchievements.java").read_text()
          gm=(base/"GamerMusicProfiles.java").read_text()
          gradle=Path("mobile-node-lab/mobile/build.gradle").read_text()
          notes=(base/"WhatsNewActivity.java").read_text()
          assert 'versionCode 87' in gradle and "versionName '0.21.13'" in gradle
          assert 'private final Set<String> expandedAchievements=new HashSet<>()' in panel
          assert 'if(!expandedAchievements.add(key))expandedAchievements.remove(key)' in panel
          assert 'categoryHeader("basic"' in panel
          assert 'categoryHeader("gm"' in panel
          assert 'categoryHeader("leaders"' in panel
          assert 'categoryHeader("rare"' in panel
          assert 'int totalSpecial=16' in panel
          assert 'int addedPercent=t>0?(int)Math.round(100.0*c/t):0;' in panel
          assert 'addedPercent+"%"' in panel
          assert 'categoryHeader("all","ACHIEVEMENTS",basic+specialEarned(roster),20' in panel
          assert 'if(categoryHeader("all","ACHIEVEMENTS"' in panel
          assert 'achievementHost=new LinearLayout(activity)' in panel
          assert 'LinearLayout shell=card(achievementHost==null?content:achievementHost)' in panel
          assert 'specialAchievements();' in panel
          assert 'leadershipEarned,10' in panel
          for name in ('AJ · The Chairman','Asriel · The Spawn of Lily and Seawolf',
                       'Seawolf · The Founder','Lily · The Lil shit','Imposter · Sus',
                       'Gamewitch · The Mysterious One',
                       'Seawolf & Lily · Two Hearts','GM2 · Initiated into the Cult',
                       'Gamer Music: Complete Discography','Royal Flush',
                       'Owners\' Meeting','The Entire Upper Deck'):
              assert name in panel,name
          assert 'usr_5a0bd6d8-25c6-4a7b-a1a6-9ea85125398f' in gm
          assert 'usr_b85631a8-5e23-4b88-a14b-4c8a2ae863c1' in names
          assert 'usr_2a833076-03ac-4212-aeff-0708d8eab968' in names
          assert 'snapshot.friendsComplete' in names
          assert 'categoryHeader("special"' not in panel # summary is not an inert expander
          versions=[line.split('RELEASE · ')[1].split('"')[0]
            for line in notes.splitlines() if 'RELEASE · v0.' in line]
          assert versions==['v0.21.13','v0.21.12','v0.21.11','v0.21.10','v0.21.9'],versions
          assert 'delegated' not in notes.lower() and 'non-staff' not in notes.lower()
          print("PASS: 16 special achievements; four nested expandable categories; v0.21.13")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile complete Android app without signing or publishing
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
