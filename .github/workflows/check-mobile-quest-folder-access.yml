name: Validate Quest optional folder watcher v0.19.2

on:
  push:
    branches:
      - feature/mobile-v0.19.2-quest-folder-access
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/check-mobile-quest-folder-access.yml'
      - 'mobile-node-lab/QUEST_v0.19.2_SAF_QA.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assert Quest-only opt-in and fallback safety
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab")
          saf=(root/"QuestSafLogWatcher.java").read_text()
          service=(root/"MobileNodeService.java").read_text()
          setup=(root/"MobileDeployActivity.java").read_text()
          gradle=Path("mobile-node-lab/mobile/build.gradle").read_text()
          assert 'QuestDevice.isQuestDevice() && FOLDER.equals(' in saf
          assert 'getPersistedUriPermissions()' in saf
          assert 'takePersistableUriPermission(uri,Intent.FLAG_GRANT_READ_URI_PERMISSION)' in saf
          assert 'DocumentsContract.buildChildDocumentsUriUsingTree' in saf
          assert 'output_log_' in saf and 'OnPlayerJoined' in saf and 'OnPlayerLeft' in saf
          assert 'offset=fileSize(doc)' in saf
          assert 'if(complete<0)return' in saf
          assert 'useFolderMode=QuestSafLogWatcher.isSelected(this)' in service
          assert 'if(useFolderMode && folderWatcher!=null)folderWatcher.pollOnce()' in service
          assert 'captureFromWatcher(active)' in service and 'captureLocalActivity(active)' in service
          assert 'if(useFolderMode)active=folderWatcher;' in service
          assert 'if(watcher==null)connectWatcher();' in service
          assert 'startActivityForResult(picker,QUEST_FOLDER_REQUEST)' in setup
          assert 'QuestSafLogWatcher.selectShizuku(this)' in setup
          assert 'if(QuestSafLogWatcher.isSelected(this))' in setup
          assert 'versionCode 54' in gradle and "versionName '0.19.2'" in gradle
          print("Quest-only experimental SAF, durable queues, fallback and release version verified.")
          PY
      - name: Compile Android debug APK only
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
