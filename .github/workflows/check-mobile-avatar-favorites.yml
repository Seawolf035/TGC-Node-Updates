name: Validate Staff Companion avatar UX v0.19.5

on:
  push:
    branches:
      - feature/mobile-v0.19.5-avatar-favorites-ux
    paths:
      - 'mobile-node-lab/mobile/**'
      - 'mobile-node-lab/QUEST_v0.19.5_AVATAR_UX_QA.md'
      - '.github/workflows/check-mobile-avatar-favorites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify avatar save flow, legacy storage, UI terminology, and phone/Quest boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          store=(root/'ExtendedAvatarStore.java').read_text()
          save=(root/'ExtendedAvatarSaveFlow.java').read_text()
          library=(root/'ExtendedAvatarActivity.java').read_text()
          favorites=(root/'VRChatAvatarActivity.java').read_text()
          quest=(root/'QuestToolsActivity.java').read_text()
          groups=(root/'VRChatGroupToolsActivity.java').read_text()
          player=(root/'VRChatDetailActivity.java').read_text()
          device=(root/'QuestDevice.java').read_text()
          service=(root/'MobileNodeService.java').read_text()
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'tgc_vrcx_extended_avatar_favorites.db' in store
          assert 'PRIMARY KEY(account_id,avatar_id)' in store
          assert 'categoryFor(String user,String avatar)' in store
          assert 'savedIds(String user)' in store
          assert 'VRChatApi.requireActiveVRCPlus(host)' in save
          assert 'VRChatApi.avatar(host,id)' in save
          assert 'ExtendedAvatarStore.category(category)' in save
          assert 'db.move(account,id,selected)' in save
          assert 'db.add(account,detail,selected)' in save
          assert 'No avatar ID is needed.' in favorites
          assert 'saved?"★ Saved":"☆ Save"' in favorites
          assert 'ExtendedAvatarSaveFlow.open(this,avatar,worker' in favorites
          assert 'this::refreshExtendedSaved' in favorites
          assert '"extended_picker",true' in library
          assert 'Add by avatar link / ID · Advanced' in library
          assert 'categoryFor(original,id)' in library
          assert '"MINI-VRCX' not in groups
          assert '"Mini-VRCX' not in quest
          assert '"Pinned groups appear in your saved group shortcuts."' in player
          assert 'return !isQuestDevice();' in device
          assert 'QuestSafLogWatcher.isSelected(this)' in service
          assert 'versionCode 57' in gradle and "versionName '0.19.5'" in gradle
          print('Avatar, subscription, storage, branding, and Quest/phone isolation checks passed.')
          PY
      - name: Compile Android debug APK
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
