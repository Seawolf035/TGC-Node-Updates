name: Quest navigation and sticky quick bar QA (non-publishing)

on:
  push:
    branches:
      - fix/mobile-v0.19.14-quest-back-and-sticky-quickbar
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/mobile-companion-quest-navigation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Quest layout, consent, updater and unchanged network
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab")
          back=(src/"QuestBackApplication.java").read_text()
          tools=(src/"QuestToolsActivity.java").read_text()
          home=(src/"CompanionActivity.java").read_text()
          account=(src/"VRChatAccountActivity.java").read_text()
          updater=(src/"MobileUpdaterActivity.java").read_text()
          gradle=Path("mobile-node-lab/mobile/build.gradle").read_text()
          manifest=Path("mobile-node-lab/mobile/src/main/AndroidManifest.xml").read_text()
          assert "Gravity.TOP|Gravity.START" in back
          assert "Gravity.END|Gravity.BOTTOM" not in back
          assert "WindowInsetsCompat.Type.systemBars()" in back
          assert "WindowInsetsCompat.Type.displayCutout()" in back
          assert "BACK_RESERVED_CONTENT_TAG" in back
          assert "android.R.id.content" in back
          assert "content.getTag(BACK_RESERVED_CONTENT_TAG)==null" in back
          assert "content.getPaddingTop()+dp(activity,60)" in back
          assert "ViewCompat.requestApplyInsets(back)" in back
          assert "if(!QuestDevice.isQuestDevice())return;" in back
          assert "activity.onBackPressed()" in back
          assert "if(activity instanceof CompanionLicenseActivity)return;" in back
          assert "activity instanceof MobileUpdaterActivity &&" in back
          assert "if(!CompanionLicense.accepted(activity))" in back
          assert "List<String> bar=OverlayPreferences.quickBar(this);" in tools
          assert 'if(isHub() && !"shortcuts".equals(page))' not in tools
          assert tools.index("root.addView(quick,") < tools.index("scroll=new ScrollView(this);")
          assert tools.index("root.addView(quick,") < tools.index("scroll.addView(body);")
          assert "q.setOnClickListener(v->openShortcut(key));" in tools
          assert "scroll.addView(quick)" not in tools and "body.addView(quick)" not in tools
          assert "private void goBack()" in tools and "onBackPressed(){goBack();}" in tools
          assert "questTabs.pop()" in home
          assert "EMAIL OR ORIGINAL USERNAME" in account
          assert "TrackingSetupGuide.acknowledged(this)" in home
          assert "verifySameSigner(candidate)" in updater
          assert "SHA-256 mismatch" in updater
          assert 'android:name=".QuestToolsActivity" android:exported="false"' in manifest
          assert "versionCode 66" in gradle and "versionName '0.19.14'" in gradle
          assert "applicationId 'club.thegamerclub.nodelab'" in gradle
          print("PASS: top-left Quest Back, fixed three-action quick bar across nested pages, consent, updater and navigation invariants.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK without publication
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
