name: Validate one-time tracking setup v0.19.9

on:
  push:
    branches:
      - feature/mobile-v0.19.9-first-run-logging-guide
    paths:
      - 'mobile-node-lab/mobile/**'
      - 'mobile-node-lab/QUEST_v0.19.9_ONBOARDING_QA.md'
      - '.github/workflows/check-mobile-tracking-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assert one-time onboarding and old-install migration
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          controls=(root/'MobileDeployActivity.java').read_text()
          main=(root/'CompanionActivity.java').read_text()
          quest=(root/'QuestToolsActivity.java').read_text()
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'tgc_tracking_first_setup_v1' in controls
          assert 'logging_guide_acknowledged' in controls
          assert 'previouslyLinked=MobileCredentials.load(this)!=null' in controls
          assert 'putBoolean(FIRST_SETUP_ACK,previouslyLinked)' in controls
          assert 'if(state==null && !setupAcknowledged())' in controls
          assert 'handler.post(this::showFirstSetupGuide)' in controls
          assert 'if(!setupAcknowledged())' in controls
          assert 'showFirstSetupGuide();' in controls
          assert 'Logging and select FULL' in controls
          assert 'QuestDevice.isQuestDevice()' in controls
          assert 'Shizuku in Companion' in controls
          assert 'Not yet' in controls
          assert 'I understand · Continue' in controls
          assert 'Reopen first-time tracking setup guide' in controls
          assert 'setupGuideControl.setVisibility(advanced?' in controls
          assert 'VRCHAT LOGGING — REQUIRED' not in main
          assert 'Settings → Debug → Logging and select FULL' not in quest
          assert 'REQUIRED: In VRChat' not in controls
          assert 'versionCode 61' in gradle and "versionName '0.19.9'" in gradle
          print('One-time VRChat Full setup and upgrade compatibility checks passed.')
          PY
      - name: Compile Android debug APK
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
