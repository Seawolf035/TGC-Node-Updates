name: Companion link-to-guided-setup QA (non-publishing)

on:
  push:
    branches:
      - feature/mobile-v0.21.6-link-to-setup
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/mobile-companion-link-setup-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce link-to-setup routing, authorization, and changelog policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          deploy=(base/'MobileDeployActivity.java').read_text()
          home=(base/'CompanionActivity.java').read_text()
          guide=(base/'CompanionSetupActivity.java').read_text()
          whats=(base/'WhatsNewActivity.java').read_text()
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          i=deploy.index('MobileCredentials.save(this,relay,response);')
          j=deploy.index('}catch(Exception e)',i)
          linked=deploy[i:j]
          assert 'open_setup_after_link' in linked
          assert 'Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP' in linked
          assert 'startActivity(home)' in linked and 'finish();' in linked
          assert 'startNode()' not in linked
          assert 'CompanionLicense.accepted(this)' in home
          assert 'CompanionLicenseActivity.class' in home
          assert 'StaffGate.unlocked(this)' in home
          assert 'setupAfterLink||CompanionSetupState.shouldShow(this)' in home
          assert 'CompanionSetupActivity.class' in home
          assert 'setResult(RESULT_OK);finish();' in guide
          titles=[part.split('"',1)[0] for part in
            whats.split('CompanionStyle.section(this,"') if 'RELEASE · v' in part]
          assert titles==[
            'LATEST RELEASE · v0.21.6',
            'PREVIOUS STAFF RELEASE · v0.21.5',
            'PREVIOUS STAFF RELEASE · v0.21.4',
            'PREVIOUS STAFF RELEASE · v0.21.3',
            'PREVIOUS STAFF RELEASE · v0.21.2'],titles
          assert "versionCode 80" in gradle and "versionName '0.21.6'" in gradle
          assert "applicationId 'club.thegamerclub.nodelab'" in gradle
          print('PASS: linking routes via authorized Companion setup, full consent, five recent release notes, v80 identity')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK without publishing
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
