name: QA Companion single delegated nonstaff grant (no publishing)

on:
  push:
    branches:
      - feature/mobile-v0.21.8-delegated-companion
    paths:
      - "mobile-node-lab/mobile/**"
      - ".github/workflows/mobile-companion-delegated-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegated-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect delegated trust boundaries and proposed release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          read=lambda n:(p/n).read_text()
          gate=read('StaffGate.java')
          api=read('VRChatApi.java')
          setup=read('CompanionSetupState.java')
          osc=read('OscControlStore.java')
          official=read('TgcOfficialChatboxes.java')
          mini=read('OverlayMiniVrcx.java')
          quest=read('QuestToolsActivity.java')
          themes=read('ThemePreferences.java')
          owner=read('OwnerQuestToolsPreview.java')
          main=read('CompanionActivity.java')
          relay=read('MobileRelay.java')
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'authorizedVrchatUser' in gate
          assert 'assertPersonalVrchatAccount' in gate
          assert '1228529346788982794' in gate
          assert 'usr_0f534ae6-c5c4-4025-9478-d5423da1f296' in gate
          assert 'delegated(Context context)' in gate
          assert 'officialOscTagsAllowed(Context context)' in gate
          assert 'rankTier(Context context)' in gate
          assert 'access_type' in gate and 'staff_rank' in gate
          assert 'StaffGate.assertPersonalVrchatAccount' in api
          assert 'StaffGate.authorizedVrchatUser(context)' in setup
          assert 'if(StaffGate.delegated(ctx))return false' in osc
          assert 'if(on&&!StaffGate.officialOscTagsAllowed(ctx))' in osc
          assert 'StaffGate.officialOscTagsAllowed(context)' in official
          assert 'if(!StaffGate.delegated(ctx))' in mini
          assert 'if(StaffGate.delegated(ctx))' in mini
          assert 'if(!StaffGate.delegated(this))' in quest
          assert 'StaffGate.delegated(c)||StaffGate.rankTier(c)>=4' in themes
          assert 'OWNER_DISCORD_ID="197820946608947201"' in owner
          assert 'OWNER_VRCHAT_ID="usr_2a833076-03ac-4212-aeff-0708d8eab968"' in owner
          assert 'StaffGate.delegated(this)?' in main
          assert 'versionCode 82' in gradle and "versionName '0.21.8'" in gradle
          assert 'MobileRelay.post(' not in owner
          # Android cannot invent a staff rank or authorize other users.
          assert 'put("access_type","delegated")' not in relay
          alerts=read('CompanionUpdateAlerts.java')
          worker=read('CompanionUpdateWorker.java')
          updater=read('MobileUpdaterActivity.java')
          news=read('WhatsNewActivity.java')
          assert 'MobileUpdaterActivity.fetchManifest()' in worker
          assert 'version_code' in alerts and 'last_notified_code' in alerts
          assert 'Companion updates' not in main or 'COMPANION APP UPDATES' in main
          assert 'CompanionUpdateAlerts.restore(this)' in main
          assert 'CompanionUpdateAlerts.checkOnOpen(this)' in main
          assert 'MobileUpdaterActivity.class' in main
          assert 'static JSONObject fetchManifest()' in updater
          assert 'verifySameSigner(candidate)' in updater
          assert 'version_code' in updater
          versions=[line.split('RELEASE · ')[1].split('"')[0]
            for line in news.splitlines() if 'RELEASE · v0.' in line]
          assert versions==['v0.21.8','v0.21.7','v0.21.6','v0.21.5','v0.21.4'],versions
          print('PASS: owner-trusted delegated access, OSC exclusions, signed update alerts, current version')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile complete Android app (debug only, no publishing)
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
