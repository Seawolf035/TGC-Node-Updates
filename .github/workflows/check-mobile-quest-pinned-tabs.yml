name: Validate Quest pinned quick actions (candidate only)

on:
  push:
    branches:
      - feature/mobile-v0.19.1-quest-pinned-quick-tabs
    paths:
      - 'mobile-node-lab/mobile/**'
      - 'mobile-node-lab/QUEST_PINNED_QUICK_TABS_CANDIDATE_QA.md'
      - '.github/workflows/check-mobile-quest-pinned-tabs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate fixed Quest toolbar and phone isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          native=(base/'QuestToolsActivity.java').read_text()
          assert 'if(!QuestDevice.isQuestDevice())' in native
          assert 'new OverlayMiniVrcx(this,' in native
          assert 'if(isHub() && !"shortcuts".equals(page))' in native
          assert 'root.addView(quick,new LinearLayout.LayoutParams(-1,-2));' in native
          assert 'body.addView(quick)' not in native
          assert native.index('root.addView(quick,') < native.index('scroll=new ScrollView(this)')
          assert 'FloatingCompanionService' in native
          watcher=(base/'PrivilegedProbe.java').read_text()
          node=(base/'MobileNodeService.java').read_text()
          assert 'if(QuestDevice.isQuestDevice())' in watcher
          assert 'File questLog=findLog(new File(FOLDERS[2]),0);' in watcher
          assert 'if(questLog!=null)return questLog;' in watcher
          assert 'for(int i=0;i<2;i++)' in watcher
          assert 'SHIZUKU_VERSION=5' in node
          assert 'Watching VRChat output logs: ' in watcher
          assert 'versionCode 52' in Path('mobile-node-lab/mobile/build.gradle').read_text()
          # Synthetic lines matching the supplied private Quest logs; no user data in CI.
          import re
          event='usr_11111111-2222-3333-4444-555555555555'
          world='wrld_11111111-2222-3333-4444-555555555555'
          sample=[
            '2026.10.13 08:15:30 Debug - [Behaviour] OnPlayerJoined TestUser ('+event+')',
            '2026.10.13 08:17:59 Debug - [Behaviour] OnPlayerLeft TestUser ('+event+')',
            '2026.10.13 08:18:03 Debug - [Behaviour] Joining '+world+':12345~region(us)'
          ]
          assert re.search(r'OnPlayerJoined\s+.*?\s+\((usr_[a-fA-F0-9-]{36})\)',sample[0])
          assert re.search(r'OnPlayerLeft\s+.*?\s+\((usr_[a-fA-F0-9-]{36})\)',sample[1])
          assert re.search(r'\bJoining\s+(wrld_[a-fA-F0-9-]{36}:[^\s]+)',sample[2])
          print('Quest quick tabs fixed; Quest log directory selected only on Quest; synthetic events recognized.')
          PY
      - name: Compile Android debug without signing or publishing
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
