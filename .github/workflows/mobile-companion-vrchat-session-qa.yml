name: Companion VRChat Session UX QA (non-publishing)

on:
  push:
    branches:
      - feature/mobile-v0.21.1-vrchat-session-accuracy-preview-retry
    paths:
      - 'mobile-node-lab/mobile/**'
      - '.github/workflows/mobile-companion-vrchat-session-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify saved cookies are not mistaken for live sign-in
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          acct=(root/'VRChatAccountActivity.java').read_text()
          preview=(root/'QuestToolsActivity.java').read_text()
          guard=(root/'OwnerQuestToolsPreview.java').read_text()
          api=(root/'VRChatApi.java').read_text()
          session=(root/'VRChatSession.java').read_text()
          updater=(root/'MobileUpdaterActivity.java').read_text()
          news=(root/'WhatsNewActivity.java').read_text()
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'VRChatApi.currentUser(this)' in acct
          assert 'connectionState==VERIFIED&&id.equals(checkedUserId)' in acct
          assert '● Signed in · verified with VRChat' in acct
          assert '● VRChat session expired' in acct
          assert '● VRChat connection unverified' in acct
          assert 'VRChat session expired' in api
          assert 'return new Response(status,text,cookies)' in api
          assert 'instanceof SecurityException' in acct
          assert 'authFailed?EXPIRED:UNAVAILABLE' in acct
          assert 'showLoginForm=true' in acct
          assert 'Cancel · keep saved session' in acct
          assert 'Sign in again' in acct
          assert 'if(problem==null)' in acct
          assert 'VRChatSession.clear(this)' in acct
          # Reauthentication doesn't clear a saved session until user explicitly
          # signs out; new successful login replaces it inside VRChatApi.
          assert 'private void startFreshLogin()' not in acct
          assert 'checkedAt=System.currentTimeMillis()' in acct
          assert 'connectionState=UNKNOWN' in acct
          assert 'VRChatApi.verify2fa(this,value,mode)' in acct
          assert 'private boolean accountScreenOpened=false;' in preview
          assert 'accountScreenOpened=true;' in preview
          assert 'if(accountScreenOpened && !phonePreviewAuthorized)' in preview
          assert 'verifyPhonePreview();' in preview
          assert 'OwnerQuestToolsPreview.verifyLive(this)' in preview
          assert 'OwnerQuestToolsPreview.hasOwnerPair(this)' in preview
          assert 'StaffGate.verifiedDiscordMatches' in guard
          assert 'VRChatApi.currentUser(context)' in guard
          assert 'AES/GCM/NoPadding' in session
          assert 'verifySameSigner(candidate)' in updater
          assert 'versionCode 75' in gradle and "versionName '0.21.1'" in gradle
          assert "applicationId 'club.thegamerclub.nodelab'" in gradle
          assert 'v0.21.1' in news
          print('PASS: live VRChat session verification, expired-vs-offline, non-destructive login replacement, 2FA, owner-only preview auto retry, safe upgrade')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android debug APK without publishing
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
