name: Validate Quest folder-default and Android phone Shizuku v0.19.3

on:
  push:
    branches:
      - feature/mobile-v0.19.3-quest-folder-default
    paths:
      - 'mobile-node-lab/mobile/**'
      - 'mobile-node-lab/QUEST_v0.19.3_FOLDER_DEFAULT_QA.md'
      - '.github/workflows/check-mobile-quest-folder-default.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate Quest defaults, fallback and phone safety
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('mobile-node-lab/mobile/src/main/java/club/thegamerclub/nodelab')
          saf=(root/'QuestSafLogWatcher.java').read_text()
          ui=(root/'MobileDeployActivity.java').read_text()
          service=(root/'MobileNodeService.java').read_text()
          companion=(root/'CompanionActivity.java').read_text()
          gradle=Path('mobile-node-lab/mobile/build.gradle').read_text()
          assert 'getString(MODE,FOLDER)' in saf
          assert 'QuestDevice.isQuestDevice() && !SHIZUKU.equals(' in saf
          assert 'return QuestDevice.isQuestDevice() && !SHIZUKU.equals(' in saf
          assert 'selectShizuku(Context ctx)' in saf and 'selectFolderMode(Context ctx)' in saf
          assert 'getPersistedUriPermissions()' in saf
          assert 'takePersistableUriPermission(uri,Intent.FLAG_GRANT_READ_URI_PERMISSION)' in saf
          assert 'DocumentsContract.buildChildDocumentsUriUsingTree' in saf
          assert 'offset=fileSize(doc)' in saf
          assert 'if(useFolderMode && !QuestSafLogWatcher.hasGrant(this))' in service
          assert 'tracking_mode' in service
          assert 'captureFromWatcher(active)' in service and 'captureLocalActivity(active)' in service
          assert 'if(!QuestDevice.isQuestDevice()){' in ui
          assert 'Advanced tools' in ui and 'Alternative Quest method · Shizuku fallback' in ui
          assert 'questFallbackDetails.setVisibility(advanced&&questFallbackExpanded' in ui
          assert 'QuestSafLogWatcher.selectShizuku(this)' in ui
          assert 'QuestSafLogWatcher.selectFolderMode(this)' in ui
          assert 'if(QuestSafLogWatcher.isSelected(this))' in ui
          assert 'Shizuku required for player tracking.' in companion
          assert 'versionCode 55' in gradle and "versionName '0.19.3'" in gradle
          print('Quest default folder, advanced fallback, phone Shizuku and release version verified')
          PY
      - name: Compile Android debug APK only
        working-directory: mobile-node-lab
        run: gradle :mobile:assembleDebug --no-daemon --stacktrace
