plugins { id 'com.android.application' }

def signingVars = ['TGC_ANDROID_KEYSTORE_FILE', 'TGC_ANDROID_KEYSTORE_PASSWORD', 'TGC_ANDROID_KEY_ALIAS', 'TGC_ANDROID_KEY_PASSWORD']
def hasReleaseKey = signingVars.every { System.getenv(it) != null && !System.getenv(it).trim().isEmpty() }

android {
    signingConfigs {
        if (hasReleaseKey) {
            companionRelease {
                storeFile file(System.getenv('TGC_ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('TGC_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TGC_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('TGC_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.companionRelease
        }
    }
    namespace 'club.thegamerclub.nodelab'
    compileSdk 35
    defaultConfig {
        applicationId 'club.thegamerclub.nodelab'
        minSdk 26
        targetSdk 35
        versionCode 32
        versionName '0.16.5'
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
